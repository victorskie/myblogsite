<!DOCTYPE html>
<html>
<head>
    <title>{{ blog_post.title }} - Blogsite</title>
</head>
<body>
    <h1>{{ blog_post.title }}</h1>
    <p><strong>Author:</strong> {{ blog_post.author_name }}</p>
    <p><strong>Created:</strong> {{ blog_post.created_at|date:"F d, Y, H:i A" }}</p>
    <p>{{ blog_post.content }}</p>
    <a href="{% url 'blog_titles' %}">Back to Titles</a>
</body>
</html>
