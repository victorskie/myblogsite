<!DOCTYPE html>
<html>
<head>
    <title>Confirm Delete - Blogsite</title>
</head>
<body>
    <h1>Confirm Delete</h1>
    <p>Are you sure you want to delete the blog post "{{ blog_post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'blog_titles' %}">No, Cancel</a>
    </form>
</body>
</html>
